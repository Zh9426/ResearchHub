name: ResearchHub 检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-mcp-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/mcp/requirements.txt
      - run: pip install -r apps/api/requirements.txt -r apps/mcp/requirements.txt pytest
      - run: python -m pytest tests/backend tests/mcp tests/release -q
      - name: 新迁移可生成 PostgreSQL SQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci
        run: alembic -c infrastructure/migrations/alembic.ini upgrade head --sql > /tmp/migration.sql
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
