name: ResearchHub 检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-network-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      client-postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: researchhub_sync_kernel_qa
          POSTGRES_USER: researchhub_sync_qa
          POSTGRES_PASSWORD: ephemeral-browser-ci-only
        ports:
          - 35433:5432
        options: >-
          --health-cmd "pg_isready -U researchhub_sync_qa -d researchhub_sync_kernel_qa"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HUB_SYNC_QA: '1'
      HUB_RELAY_QA: '1'
      HUB_SYNC_QA_URL: postgresql+psycopg://researchhub_sync_qa:ephemeral-browser-ci-only@127.0.0.1:35433/researchhub_sync_kernel_qa
      PLAYWRIGHT_BROWSERS_PATH: /opt/rh-qa-browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定依赖与一次性用户证书工具
        run: |
          pip install -r apps/api/requirements.txt -r apps/relay/requirements.txt -r tests/secure_sync/requirements.txt
          npm ci --prefix apps/web
          npm ci --prefix apps/browser-qa
          npm ci --prefix packages/secure-sync
          sudo apt-get update
          sudo apt-get install -y libnss3-tools acl
          sudo install -d -m 0755 -o "$USER" /opt/rh-qa-browser
          cd apps/browser-qa
          npx playwright install --with-deps chromium
      - name: 普通双节点构建（无测试授权注入）
        env:
          RH_QA_TEST_ONLY: '0'
        run: |
          node --test apps/browser-qa/scripts/network-evidence-reporter.test.ts
          node --test apps/browser-qa/scripts/crashpad-path-probe.test.mjs
          python -m pytest tests/test_browser_network_ci_diagnostics.py -q
          npm --prefix packages/secure-sync run typecheck
          npm --prefix apps/browser-qa run typecheck
          npm --prefix apps/browser-qa run build:sync
          RH_QA_PROFILE=pc npm --prefix apps/browser-qa run build
      - name: 独立OS用户真实浏览器配对与原入口严格TLS
        run: python scripts/browser-network-qa-ci.py
      - name: 上传网络白名单结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-network-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/runtime/browser-sync-qa/network-ci/harness-summary.json
            storage/runtime/browser-sync-qa/network-ci/trusted-summary.json
            storage/runtime/browser-sync-qa/network-ci/untrusted-summary.json
            storage/runtime/browser-sync-qa/network-ci/trusted-desktop.png
            storage/runtime/browser-sync-qa/network-ci/trusted-mobile.png
            storage/runtime/tls-case-evidence/ingress-*.json
          if-no-files-found: warn
          retention-days: 30
  browser-security-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/storage/runtime/browser-local-qa/browsers
      RH_B1_ATTEMPT: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定浏览器与独立Python密码实现
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r apps/api/requirements.txt -r tests/secure_sync/requirements.txt
          npm ci --prefix apps/web
          npm ci --prefix apps/browser-qa
          npm ci --prefix packages/secure-sync
      - name: 安装隔离Chromium
        working-directory: apps/browser-qa
        run: npx playwright install --with-deps chromium
      - name: 类型检查及显式合成授权测试构建
        env:
          RH_QA_TEST_ONLY: '1'
        run: |
          npm --prefix packages/secure-sync run typecheck
          npm --prefix apps/browser-qa run typecheck
          npm --prefix apps/browser-qa run build:sync
      - name: 真实Chromium正式密码与独立Python互通
        working-directory: apps/browser-qa
        run: node node_modules/@playwright/test/cli.js test --config playwright.security.config.ts
      - name: 上传白名单结果而非原始密码测试材料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-security-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/runtime/browser-sync-qa/security/ci-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 14
  browser-local-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/storage/runtime/browser-local-qa/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/browser-qa/package-lock.json
      - name: 安装固定 QA 与共享组件类型依赖
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/browser-qa
          npm ci --prefix packages/secure-sync
      - name: 安装隔离 Chromium 及 Linux 系统依赖
        working-directory: apps/browser-qa
        run: npx playwright install --with-deps chromium
      - run: npm --prefix apps/browser-qa run typecheck
      - run: npm --prefix apps/browser-qa run build
      - name: 真实 Chromium 本地离线与安全能力验收
        run: npm --prefix apps/browser-qa test
      - name: 上传白名单合成 UI 与脱敏结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-local-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/runtime/browser-local-qa/evidence/junit.xml
            storage/runtime/browser-local-qa/evidence/summary.json
            storage/runtime/browser-local-qa/hdsp-failed-negative-desktop.png
            storage/runtime/browser-local-qa/hdsp-failed-negative-mobile.png
            storage/runtime/browser-local-qa/note-saved-desktop.png
            storage/runtime/browser-local-qa/note-saved-mobile.png
            storage/runtime/browser-local-qa/rescue-desktop.png
            storage/runtime/browser-local-qa/rescue-mobile.png
            storage/runtime/browser-local-qa/task3-attempt-*.png
          if-no-files-found: warn
          retention-days: 14
  backend-mcp-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/mcp/requirements.txt
      - run: pip install -r apps/api/requirements.txt -r apps/mcp/requirements.txt pytest
      - run: python -m pytest tests/backend tests/mcp tests/release -q
      - name: 新迁移可生成 PostgreSQL SQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci
        run: alembic -c infrastructure/migrations/alembic.ini upgrade head --sql > /tmp/migration.sql
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
  sync-kernel-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: researchhub_sync_kernel_qa
          POSTGRES_USER: researchhub_sync_qa
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 35433:5432
        options: >-
          --health-cmd "pg_isready -U researchhub_sync_qa -d researchhub_sync_kernel_qa"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HUB_SYNC_QA: '1'
      HUB_SYNC_QA_URL: postgresql+psycopg://researchhub_sync_qa:ephemeral-ci-only@127.0.0.1:35433/researchhub_sync_kernel_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r apps/api/requirements.txt -r tests/sync_kernel/requirements.txt -r tests/secure_sync/requirements.txt
      - run: npm ci --prefix apps/web
      - name: 两端独立固定协议样例
        run: |
          python -m pytest tests/sync_vectors -q
          npm --prefix packages/sync-protocol test
          npm --prefix packages/sync-protocol run typecheck
      - name: 真实隔离 PostgreSQL 内核与故障回归
        run: python -m pytest tests/sync_kernel tests/sync_pg -q
  secure-relay-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      client-postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: researchhub_sync_kernel_qa
          POSTGRES_USER: researchhub_sync_qa
          POSTGRES_PASSWORD: ephemeral-secure-ci-only
        ports:
          - 35433:5432
        options: >-
          --health-cmd "pg_isready -U researchhub_sync_qa -d researchhub_sync_kernel_qa"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HUB_SYNC_QA: '1'
      HUB_RELAY_QA: '1'
      HUB_SYNC_QA_URL: postgresql+psycopg://researchhub_sync_qa:ephemeral-secure-ci-only@127.0.0.1:35433/researchhub_sync_kernel_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装独立密码库与 QA 依赖
        run: |
          pip install -r apps/api/requirements.txt -r apps/relay/requirements.txt -r tests/secure_sync/requirements.txt -r tests/sync_kernel/requirements.txt
          npm ci --prefix apps/web
          npm ci --prefix packages/secure-sync
      - name: 独立 Python 与 TypeScript 互操作及属性验证
        run: |
          mkdir -p storage/runtime
          python -m pytest tests/secure_sync -q --basetemp storage/runtime/ci-secure-crypto
          npm --prefix packages/secure-sync test
          npm --prefix packages/secure-sync run typecheck
      - name: 隔离初始化失败后只清理本次 QA 资源
        run: python -m pytest tests/secure_relay_lifecycle -q --basetemp storage/runtime/ci-relay-lifecycle
      - name: 真实 loopback TLS、隔离 PG、进程故障与明文扫描
        run: |
          python scripts/secure-relay-qa.py --init
          python -m pytest tests/pc_pairing_network -q --basetemp storage/runtime/browser-sync-qa/ci-pairing-tests
          python scripts/secure-relay-qa.py --test
      - name: 保留 TLS 用例的固定字段诊断
        if: always()
        run: python scripts/secure-relay-diagnostics.py
      - name: 上传 TLS 阶段证据（不含请求或密钥）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-stages-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/runtime/tls-case-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: 销毁本次临时 Relay 与 QA 环境
        if: always()
        run: python scripts/secure-relay-qa.py --destroy
